<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00d4ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cielito Home" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Alex+Brush&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Monsieur+La+Doulaise&family=Pacifico&family=Parisienne&family=Pinyon+Script&family=Satisfy&display=swap" rel="stylesheet">
    <title>Cielito Home - Checador</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="global-error" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:white; z-index:9999; padding:20px; color:red; overflow:auto; text-align:left; font-family:monospace;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('global-error');
        el.style.display = 'block';
        el.innerHTML += '<h3>Uncaught Error</h3><pre>' + e.message + '\\n' + e.filename + ':' + e.lineno + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('global-error');
        el.style.display = 'block';
        el.innerHTML += '<h3>Unhandled Promise Rejection</h3><pre>' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
      });
      // Sobrescribir console.error para capturar errores de React render
      var originalError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        originalError.apply(console, args);
        var message = args.join(' ');
        if (message && (message.indexOf('React') !== -1 || message.indexOf('Error:') !== -1)) {
          var el = document.getElementById('global-error');
          el.style.display = 'block';
          el.innerHTML += '<h3>Console Error</h3><pre>' + message + '</pre>';
        }
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registrado con éxito:', registration.scope);
            })
            .catch(error => {
              console.log('Fallo en el registro del SW:', error);
            });
        });
      }
    </script>
  </body>
</html>
